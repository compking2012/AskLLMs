<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>问问大模型</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 500px;
      min-height: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: #ffffff;
      padding: 20px;
      margin: 0;
      transition: background-color 0.3s, color 0.3s;
    }
    
    /* 深色主题 */
    body.dark-theme {
      background: #1f2937;
      color: #f9fafb;
    }
    
    body.dark-theme .header {
      border-bottom-color: #374151;
    }
    
    body.dark-theme .title {
      color: #f9fafb;
    }
    
    body.dark-theme .settings-btn,
    body.dark-theme .back-btn {
      color: #9ca3af;
    }
    
    body.dark-theme .settings-btn:hover,
    body.dark-theme .back-btn:hover {
      background: #374151;
      color: #f9fafb;
    }
    
    body.dark-theme textarea {
      background: #374151;
      border-color: #4b5563;
      color: #f9fafb;
    }
    
    body.dark-theme textarea:focus {
      border-color: #6366f1;
      background: #4b5563;
    }
    
    body.dark-theme textarea::placeholder {
      color: #6b7280;
    }
    
    body.dark-theme .platforms-section {
      border-top-color: #374151;
    }
    
    body.dark-theme .platforms-label {
      color: #d1d5db;
    }
    
    body.dark-theme .platform-btn {
      background: #374151;
    }
    
    body.dark-theme .platform-btn:hover {
      background: #4b5563;
    }
    
    body.dark-theme .status.success {
      background: linear-gradient(135deg, #065f46 0%, #047857 100%);
      color: #d1fae5;
      border-color: #059669;
    }
    
    body.dark-theme .status.error {
      background: linear-gradient(135deg, #991b1b 0%, #7f1d1d 100%);
      color: #fee2e2;
      border-color: #dc2626;
    }
    
    body.dark-theme .settings-section-title {
      color: #f9fafb;
    }
    
    body.dark-theme .settings-option-label {
      color: #d1d5db;
    }
    
    body.dark-theme .settings-radio {
      color: #d1d5db;
    }
    
    body.dark-theme .settings-checkbox {
      background: transparent;
      border: none;
      color: #d1d5db;
    }
    
    body.dark-theme .settings-checkbox:hover {
      background: transparent;
      border: none;
    }
    
    body.dark-theme .settings-checkbox.active {
      background: transparent;
      border: none;
    }
    
    body.dark-theme .settings-input {
      background: #374151;
      border-color: #4b5563;
      color: #f9fafb;
    }
    
    body.dark-theme .settings-input:focus {
      border-color: #6366f1;
      background: #4b5563;
    }
    
    body.dark-theme .settings-color-option {
      color: #d1d5db;
    }
    
    body.dark-theme .settings-actions {
      border-top-color: #374151;
    }
    
    body.dark-theme .settings-btn-secondary {
      background: #374151;
      color: #d1d5db;
    }
    
    body.dark-theme .settings-btn-secondary:hover {
      background: #4b5563;
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e8e8e8;
      position: relative;
    }
    
    .header-content {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      justify-content: flex-start; /* 左对齐 */
    }
    
    .header.with-back-btn .header-content {
      margin-left: 30px; /* 为返回按钮留出空间 */
    }
    
    .header.with-settings-btn .header-content {
      margin-right: 40px; /* 为设置按钮留出空间 */
    }
    
    .settings-btn {
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 18px;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.2s;
      color: #6b7280;
      z-index: 1;
    }
    
    .settings-btn:hover {
      background: #f3f4f6;
      color: #1f2937;
    }
    
    .back-btn {
      position: absolute;
      left: 0;
      top: 0;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 18px;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.2s;
      color: #6b7280;
      z-index: 1;
    }
    
    .back-btn:hover {
      background: #f3f4f6;
      color: #1f2937;
    }
    
    .page {
      display: none;
    }
    
    .page.active {
      display: block;
    }
    
    .settings-section {
      margin-bottom: 24px;
    }
    
    .settings-section-title {
      font-size: 14px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 12px;
    }
    
    .settings-option {
      margin-bottom: 16px;
    }
    
    .settings-option-label {
      font-size: 13px;
      color: #4b5563;
      margin-bottom: 8px;
      display: block;
    }
    
    .settings-radio-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    
    .settings-radio {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 13px;
      color: #4b5563;
    }
    
    .settings-radio input[type="radio"] {
      cursor: pointer;
    }
    
    .settings-checkbox-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    
    .settings-checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      border: none;
      transition: all 0.2s;
    }
    
    .settings-checkbox:hover {
      background: transparent;
    }
    
    .settings-checkbox input[type="checkbox"] {
      cursor: pointer;
    }
    
    .settings-checkbox.active {
      background: transparent;
      border: none;
    }
    
    .settings-checkbox .icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .settings-checkbox .icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .settings-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }
    
    .settings-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    
    .settings-color-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .settings-color-option {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 13px;
      color: #4b5563;
    }
    
    .settings-color-option input[type="radio"] {
      cursor: pointer;
    }
    
    .settings-color-preview {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: 2px solid #e5e7eb;
    }
    
    .settings-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #e8e8e8;
    }
    
    .settings-btn-primary {
      flex: 1;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }
    
    .settings-btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }
    
    .settings-btn-secondary {
      flex: 1;
      background: #f3f4f6;
      color: #4b5563;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }
    
    .settings-btn-secondary:hover {
      background: #e5e7eb;
    }
    
    .title {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
      letter-spacing: -0.02em;
    }
    
    .emoji {
      font-size: 24px;
      filter: grayscale(0);
    }
    
    .input-wrapper {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 20px;
    }
    
    textarea {
      flex: 1;
      min-height: 48px;
      max-height: 200px;
      padding: 12px 16px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      resize: vertical;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.6;
      transition: all 0.2s;
      outline: none;
      background: #fafafa;
    }
    
    textarea:focus {
      border-color: #6366f1;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    
    textarea::placeholder {
      color: #9ca3af;
    }
    
    #send-btn {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white;
      border: none;
      padding: 0 24px;
      height: 48px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.25);
    }
    
    #send-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
    }
    
    #send-btn:active:not(:disabled) {
      transform: translateY(0);
    }
    
    #send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .platforms-section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #e8e8e8;
    }
    
    .platforms-label {
      font-size: 13px;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }
    
    .platforms-grid {
      display: flex;
      gap: 12px;
      justify-content: center;
    }
    
    .platform-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      padding: 0;
      border: none;
      border-radius: 10px;
      background: #ffffff;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
    }
    
    .platform-btn .icon {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      overflow: hidden;
      transition: all 0.2s;
    }
    
    .platform-btn .icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: grayscale(100%) opacity(0.3);
      transition: all 0.2s;
    }
    
    .platform-btn:hover {
      background: #f5f5f5;
      transform: translateY(-2px);
    }
    
    .platform-btn:hover .icon img {
      filter: grayscale(0%) opacity(0.6);
    }
    
    .platform-btn.active {
      background: transparent;
    }
    
    .platform-btn.active .icon img {
      filter: grayscale(0%) opacity(1);
    }
    
    .platform-btn.active:hover {
      background: transparent;
      transform: translateY(-2px);
    }
    
    /* 拖拽选择模式样式 */
    body.drag-select-mode {
      user-select: none;
    }
    
    body.drag-select-mode .platform-btn {
      cursor: default;
    }
    
    .platform-btn.drag-selecting {
      background: transparent !important;
      transform: translateY(-2px);
    }
    
    body.drag-select-mode .platform-btn:hover {
      background: transparent !important;
      transform: translateY(-2px);
    }
    
    /* 圆形进度条样式 */
    .platform-btn .progress-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    .platform-btn.loading .progress-ring {
      opacity: 1;
    }
    
    .platform-btn .progress-ring svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    
    .platform-btn .progress-ring circle {
      fill: none;
      stroke-width: 3;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.3s ease;
    }
    
    .platform-btn .progress-ring .bg-circle {
      stroke: rgba(99, 102, 241, 0.2);
    }
    
    .platform-btn .progress-ring .progress-circle {
      stroke: #6366f1;
    }
    
    .platform-btn.completed .progress-ring .progress-circle {
      stroke: #10b981;
    }
    
    .platform-btn.error .progress-ring .progress-circle {
      stroke: #ef4444;
    }
    
    /* 禁用状态下的输入框 */
    textarea:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      background: #f3f4f6 !important;
    }
    
    body.dark-theme textarea:disabled {
      background: #2d3748 !important;
      opacity: 0.6;
    }
    
    /* Tooltip 样式 */
    .platform-btn::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: -32px;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      padding: 4px 10px;
      background: rgba(0, 0, 0, 0.85);
      color: white;
      font-size: 11px;
      font-weight: 500;
      border-radius: 6px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 10;
    }
    
    .platform-btn:hover::after {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }
    
    .status {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      display: none;
      animation: slideIn 0.3s ease-out;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .status.success {
      background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
      color: #065f46;
      border: 1px solid #6ee7b7;
      display: block;
    }
    
    .status.error {
      background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
      color: #991b1b;
      border: 1px solid #fca5a5;
      display: block;
    }
    
    .progress-container {
      margin-top: 16px;
      display: none;
    }
    
    .progress-container.active {
      display: block;
    }
    
    .progress-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
      color: #6b7280;
    }
    
    .progress-bar-wrapper {
      width: 100%;
      height: 8px;
      background: #e5e7eb;
      border-radius: 4px;
      overflow: hidden;
    }
    
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #6366f1 0%, #4f46e5 100%);
      border-radius: 4px;
      transition: width 0.3s ease-out;
      width: 0%;
    }
    
    .progress-text {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 6px;
      text-align: center;
    }
  </style>
</head>
<body>
