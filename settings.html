<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings - Ask LLMs</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 600px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: #ffffff;
      padding: 20px;
      margin: 0;
      transition: background-color 0.3s, color 0.3s;
    }
    
    /* 深色主题 */
    body.dark-theme {
      background: #1f2937;
      color: #f9fafb;
    }
    
    body.dark-theme .header {
      border-bottom-color: #374151;
    }
    
    body.dark-theme .title {
      color: #f9fafb;
    }
    
    body.dark-theme .back-btn {
      color: #9ca3af;
    }
    
    body.dark-theme .back-btn:hover {
      background: #374151;
      color: #f9fafb;
    }
    
    body.dark-theme .settings-section-title {
      color: #f9fafb;
    }
    
    body.dark-theme .settings-option-label {
      color: #d1d5db;
    }
    
    body.dark-theme .settings-radio {
      color: #d1d5db;
    }
    
    body.dark-theme .settings-checkbox {
      background: transparent;
      border: none;
      color: #d1d5db;
    }
    
    body.dark-theme .settings-checkbox:hover {
      background: transparent;
      border: none;
    }
    
    body.dark-theme .settings-checkbox.active {
      background: transparent;
      border: none;
    }
    
    body.dark-theme .settings-input {
      background: #374151;
      border-color: #4b5563;
      color: #f9fafb;
    }
    
    body.dark-theme .settings-input:focus {
      border-color: #6366f1;
      background: #4b5563;
    }
    
    body.dark-theme .settings-color-option {
      color: #d1d5db;
    }
    
    body.dark-theme .settings-btn-secondary {
      background: #374151;
      color: #d1d5db;
    }
    
    body.dark-theme .settings-btn-secondary:hover {
      background: #4b5563;
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e8e8e8;
      position: relative;
    }
    
    .header-content {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      justify-content: flex-start;
      margin-left: 30px;
    }
    
    .back-btn {
      position: absolute;
      left: 0;
      top: 0;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 20px;
      padding: 4px 8px;
      color: #4b5563;
      border-radius: 6px;
      transition: all 0.2s;
    }
    
    .back-btn:hover {
      background: #f3f4f6;
      color: #1f2937;
    }
    
    .title {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
      letter-spacing: -0.02em;
    }
    
    .emoji {
      font-size: 24px;
    }
    
    .settings-section {
      margin-bottom: 24px;
    }
    
    .settings-section-title {
      font-size: 14px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 12px;
    }
    
    .settings-option {
      margin-bottom: 16px;
    }
    
    .settings-option-label {
      font-size: 13px;
      color: #4b5563;
      margin-bottom: 8px;
      display: block;
    }
    
    .settings-radio-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    
    .settings-radio {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 13px;
      color: #4b5563;
    }
    
    .settings-radio input[type="radio"] {
      cursor: pointer;
    }
    
    .settings-checkbox-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    
    .settings-checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      border: none;
      transition: all 0.2s;
    }
    
    .settings-checkbox:hover {
      background: transparent;
    }
    
    .settings-checkbox input[type="checkbox"] {
      cursor: pointer;
    }
    
    .settings-checkbox.active {
      background: transparent;
      border: none;
    }
    
    .settings-checkbox .icon {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .settings-checkbox .icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .settings-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: all 0.2s;
    }
    
    .settings-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    
    .settings-color-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    
    .settings-color-option {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 13px;
      color: #4b5563;
    }
    
    .settings-color-option input[type="radio"] {
      cursor: pointer;
    }
    
    .settings-color-preview {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: 2px solid #e5e7eb;
    }
    
    .settings-btn-primary {
      flex: 1;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }
    
    .settings-btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }
    
    .settings-btn-secondary {
      flex: 1;
      background: #f3f4f6;
      color: #4b5563;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }
    
    .settings-btn-secondary:hover {
      background: #e5e7eb;
    }
    
    .status {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
      display: none;
      animation: slideIn 0.3s ease-out;
    }
    
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .status.success {
      background: linear-gradient(135deg, #d1fae5 0%, #a7f3d0 100%);
      color: #065f46;
      border: 1px solid #6ee7b7;
      display: block;
    }
    
    .status.error {
      background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
      color: #991b1b;
      border: 1px solid #fca5a5;
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <button id="back-btn" class="back-btn" title="Back">←</button>
    <div class="header-content">
      <span class="emoji">⚙️</span>
      <div class="title" data-i18n="settingsTitle">Settings</div>
    </div>
  </div>
  
  <div class="settings-section">
    <div class="settings-section-title" data-i18n="settingsTheme">Theme</div>
    <div class="settings-option">
      <div class="settings-radio-group">
        <label class="settings-radio">
          <input type="radio" name="theme" value="auto" id="theme-auto">
          <span data-i18n="themeAuto">Auto</span>
        </label>
        <label class="settings-radio">
          <input type="radio" name="theme" value="light" id="theme-light">
          <span data-i18n="themeLight">Light</span>
        </label>
        <label class="settings-radio">
          <input type="radio" name="theme" value="dark" id="theme-dark">
          <span data-i18n="themeDark">Dark</span>
        </label>
      </div>
    </div>
  </div>
  
  <div class="settings-section">
    <div class="settings-section-title" data-i18n="settingsLanguage">Interface Language</div>
    <div class="settings-option">
      <div class="settings-radio-group">
        <label class="settings-radio">
          <input type="radio" name="language" value="auto" id="lang-auto">
          <span data-i18n="langAuto">Auto</span>
        </label>
        <label class="settings-radio">
          <input type="radio" name="language" value="zh_CN" id="lang-zh">
          <span data-i18n="langChinese">中文</span>
        </label>
        <label class="settings-radio">
          <input type="radio" name="language" value="en" id="lang-en">
          <span data-i18n="langEnglish">English</span>
        </label>
      </div>
    </div>
  </div>
  
  <div class="settings-section">
    <div class="settings-section-title" data-i18n="settingsVisiblePlatforms">Visible AI Platforms</div>
    <div class="settings-option">
      <div class="settings-checkbox-group" id="platform-checkboxes">
        <!-- 动态生成 -->
      </div>
    </div>
  </div>
  
  <div class="settings-section">
    <div class="settings-section-title" data-i18n="settingsTabGroupTitle">Tab Group Title</div>
    <div class="settings-option">
      <input type="text" id="tab-group-title" class="settings-input" placeholder="大模型 / LLM">
      <div style="font-size: 11px; color: #9ca3af; margin-top: 4px;" data-i18n="settingsTabGroupTitleHint">Leave empty to use default</div>
    </div>
  </div>
  
  <div class="settings-section">
    <div class="settings-section-title" data-i18n="loginTitle">Login</div>
    <div id="login-section">
      <div class="settings-option">
        <label class="settings-option-label" data-i18n="loginUsername">Username</label>
        <input type="text" id="login-username" class="settings-input" placeholder="Enter username">
      </div>
      <div class="settings-option">
        <label class="settings-option-label" data-i18n="loginPassword">Password</label>
        <input type="password" id="login-password" class="settings-input" placeholder="Enter password">
      </div>
      <div class="settings-option">
        <button id="login-btn" class="settings-btn-primary" data-i18n="loginButton">Login</button>
      </div>
    </div>
    <div id="logged-in-section" style="display: none;">
      <div class="settings-option">
        <div style="font-size: 13px; color: #4b5563; margin-bottom: 12px;">
          <span data-i18n="loginSuccess">Logged in as: </span>
          <span id="logged-in-username" style="font-weight: 600;"></span>
        </div>
        <button id="logout-btn" class="settings-btn-secondary" data-i18n="logoutButton">Logout</button>
      </div>
      <div class="settings-option" style="margin-top: 16px;">
        <button id="view-history-btn" class="settings-btn-secondary" data-i18n="historyViewButton">View History</button>
      </div>
    </div>
  </div>
  
  <div class="settings-section">
    <div class="settings-section-title" data-i18n="settingsTabGroupColor">Tab Group Color</div>
    <div class="settings-option">
      <div class="settings-radio-group">
        <label class="settings-radio">
          <input type="radio" name="color-mode" value="random" id="color-random">
          <span data-i18n="colorRandom">Random</span>
        </label>
        <label class="settings-radio">
          <input type="radio" name="color-mode" value="fixed" id="color-fixed">
          <span data-i18n="colorFixed">Fixed</span>
        </label>
      </div>
    </div>
    <div class="settings-option" id="color-selector" style="display: none;">
      <div class="settings-color-group">
        <label class="settings-color-option">
          <input type="radio" name="color" value="grey">
          <span class="settings-color-preview" style="background: #9ca3af;"></span>
          <span data-i18n="colorGrey">Grey</span>
        </label>
        <label class="settings-color-option">
          <input type="radio" name="color" value="blue">
          <span class="settings-color-preview" style="background: #3b82f6;"></span>
          <span data-i18n="colorBlue">Blue</span>
        </label>
        <label class="settings-color-option">
          <input type="radio" name="color" value="red">
          <span class="settings-color-preview" style="background: #ef4444;"></span>
          <span data-i18n="colorRed">Red</span>
        </label>
        <label class="settings-color-option">
          <input type="radio" name="color" value="yellow">
          <span class="settings-color-preview" style="background: #eab308;"></span>
          <span data-i18n="colorYellow">Yellow</span>
        </label>
        <label class="settings-color-option">
          <input type="radio" name="color" value="green">
          <span class="settings-color-preview" style="background: #22c55e;"></span>
          <span data-i18n="colorGreen">Green</span>
        </label>
        <label class="settings-color-option">
          <input type="radio" name="color" value="pink">
          <span class="settings-color-preview" style="background: #ec4899;"></span>
          <span data-i18n="colorPink">Pink</span>
        </label>
        <label class="settings-color-option">
          <input type="radio" name="color" value="purple">
          <span class="settings-color-preview" style="background: #a855f7;"></span>
          <span data-i18n="colorPurple">Purple</span>
        </label>
        <label class="settings-color-option">
          <input type="radio" name="color" value="cyan">
          <span class="settings-color-preview" style="background: #06b6d4;"></span>
          <span data-i18n="colorCyan">Cyan</span>
        </label>
      </div>
    </div>
  </div>
  
  <div id="status" class="status"></div>
  
  <script src="settings.js"></script>
</body>
</html>
